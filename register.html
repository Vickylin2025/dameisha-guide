<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ef">
  <title>注册 · 玩转大梅沙</title>
  <link rel="stylesheet" href="/auth.css">
  <script type="module" src="/auth.js"></script>
</head>
<body>
  <header class="auth-header"><nav class="auth-nav"><a class="auth-brand" href="/"><span class="auth-mark" aria-hidden="true">⌁</span>玩转大梅沙</a><a class="auth-nav-link" href="/">返回首页</a></nav></header>
  <main class="auth-layout">
    <section class="auth-scene"><div class="auth-scene-copy"><span class="auth-eyebrow">A COASTAL ESCAPE · SHENZHEN</span><h1>收藏山海风景，<br>从一次注册开始。</h1><p>创建账号，开启你的大梅沙探索之旅。</p></div></section>
    <section class="auth-form-wrap"><h2>创建账号</h2><p class="auth-subtitle">加入「玩转大梅沙」</p>
      <form class="auth-form" id="registerForm">
        <label class="field">邮箱<input name="email" type="email" autocomplete="email" required></label>
        <label class="field">用户名<input name="username" autocomplete="nickname" maxlength="32" required></label>
        <label class="field">密码<input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label>
        <label class="field">确认密码<input name="confirmPassword" type="password" autocomplete="new-password" required></label>
        <p class="auth-message" role="status" aria-live="polite"></p>
        <button class="auth-submit" type="submit">注册</button>
      </form>
      <p class="auth-switch">已经有账号？<a href="/login.html">前往登录</a></p><a class="auth-back" href="/">← 返回网站首页</a>
    </section>
  </main>
</body>
</html>
